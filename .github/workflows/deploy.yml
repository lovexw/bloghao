name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 未配置 secrets 时优雅跳过（黄字警告），配置方法见 docs/DEPLOY.md 第 7 节
      - name: Check Cloudflare secrets
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets，已跳过部署。配置方法见 docs/DEPLOY.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Typecheck
        if: steps.guard.outputs.configured == 'true'
        run: npx tsc --noEmit

      # schema.sql 全部使用 CREATE TABLE IF NOT EXISTS / OR IGNORE，可安全重复执行
      - name: Apply D1 schema
        if: steps.guard.outputs.configured == 'true'
        run: npx wrangler d1 execute DB --remote --file schema.sql

      - name: Deploy
        if: steps.guard.outputs.configured == 'true'
        run: npx wrangler deploy

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
