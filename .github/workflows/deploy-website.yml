name: Deploy Website (官网)

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 未配置 secrets 时优雅跳过（黄字警告），配置方法见 docs/DEPLOY.md 第 7 节
      - name: Check Cloudflare secrets
        id: guard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::缺少 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets，已跳过官网部署。配置方法见 docs/DEPLOY.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy website
        if: steps.guard.outputs.configured == 'true'
        # 用 npx 独立运行 wrangler，避免与根目录 package.json 的依赖解析互相影响
        run: npx -y wrangler@^4 deploy --config website/wrangler.jsonc

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
